[package]
name = "gazette-engine"
version = "1.1.0"
edition = "2021"
description = "Local-first RSS/Atom engine with market data for the Omarchy Gazette bar widget"
license = "MIT"
repository = "https://github.com/KaplanHalil/omarchy-gazette"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"
feed-rs = "2"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
quick-xml = "0.37"
url = "2"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
panic = "abort"
